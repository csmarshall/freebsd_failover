name: ci

on:
  push:
    branches: [mainline]
  pull_request:

jobs:
  lint-and-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak scanner self-test (it must flag known leaks and pass known-clean strings)
        run: python3 scripts/leak_scan.py --self-test
      - name: Leak scan (generic rules; the private map never leaves the owner's machine)
        run: python3 scripts/leak_scan.py .
      - name: Shell syntax
        run: |
          set -eu
          files=$(git ls-files 'scripts/*.sh' 'tests/*.sh' 'router/**' | grep -v '\.conf$\|cron\.d')
          [ -n "$files" ] || { echo "no files to check"; exit 1; }
          n=0
          for f in $files; do
            case "$(head -1 "$f")" in
            '#!'*python*) echo "skip (python) $f"; python3 -m py_compile "$f"; continue ;;
            *bash*) bash -n "$f" ;;
            *) sh -n "$f" ;;
            esac
            echo "ok $f"; n=$((n + 1))
          done
          echo "checked $n files"
      - name: shellcheck (errors only)
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          # bash scripts by shebang; the sourced dhclient hooks and POSIX sh files as sh.
          set -eu
          files=$(git ls-files 'scripts/*.sh' 'tests/*.sh' 'router/usr/local/sbin/*' 'router/usr/local/libexec/*' \
            'router/etc/dhclient-enter-hooks' 'router/etc/dhclient-exit-hooks' 'router/etc/dhclient-scripts/*' \
            'router/usr/local/etc/rc.d/*')
          [ -n "$files" ] || { echo "no files to check"; exit 1; }
          for f in $files; do
            case "$(head -1 "$f")" in '#!'*python*) continue ;; *bash*) s=bash ;; *) s=sh ;; esac
            shellcheck -S error -e SC1090,SC1091 -s "$s" "$f"
            echo "ok ($s) $f"
          done

  tests-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook and controller tests on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: "15.0"
          prepare: pkg install -y bash
          run: |
            set -e
            freebsd-version
            sh tests/test_hooks.sh
            sh tests/test_failover.sh
            sh tests/test_radvd_detector.sh
            sh tests/test_fixes.sh
            sh tests/test_gateway_entries.sh
