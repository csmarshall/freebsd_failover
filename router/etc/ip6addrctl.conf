# /etc/ip6addrctl.conf — IPv6 address selection policy, installed at boot by
# /etc/rc.d/ip6addrctl (ip6addrctl_policy="AUTO" uses this file when present).
#
# The first nine lines are FreeBSD's stock IPv6-preferred table. The last line
# gives the 5G carrier's address space its own label.
#
# Why: ix0 (BACKUP) autoconfigures a global address even with no_radr, and ixl0
# (PRIMARY) has only a link-local one; the PRIMARY global addresses sit on the LAN
# interfaces. For traffic router itself sends out ixl0 no candidate is on the
# outgoing interface, all share label 1, and the kernel picked the BACKUP address:
# every IPv6 connection the router made was sourced from the 5G carrier space and
# sent to the fiber ISP, which drops it. With its own label the BACKUP address no longer
# matches the label of ordinary destinations (RFC 6724 rule 6), so the PRIMARY
# address wins. Traffic that really leaves ix0 still uses the BACKUP address:
# "prefer the outgoing interface" (rule 5) is checked before labels.
#
# 3fff:b0::/28 is the 5G carrier USA's allocation; the /64 on ix0 rotates inside
# it. If the 5G carrier ever hands out a prefix outside it, this stops helping:
# scripts/p3_fixes.sh checks the live address against it.
#
# prefix          precedence  label
::1/128           50   0
::/0              40   1
::ffff:0:0/96     35   4
2002::/16         30   2
2001::/32          5   5
fc00::/7           3  13
::/96              1   3
fec0::/10          1  11
3ffe::/16          1  12
3fff:b0::/28    40  14
