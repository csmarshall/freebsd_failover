# /etc/pf/pf.conf - FreeBSD Firewall
# Uplinks: ATT fiber (ixl0, primary) and TMO 5G via the TRB (ix0, backup).
# Failover changes only FIB 0's default route; this ruleset is never flushed
# or reloaded for it. Each uplink NATs to its own <att_addr>/<tmo_addr>
# table, kept current by the dhclient hooks (wan-lib.sh), so whichever
# interface the route picks NATs correctly. egress stays on ixl0.

###############################################################################
# MACROS
###############################################################################

att_if="ixl0"                   # ATT fiber WAN (primary)
tmo_if="ix0"                    # TMO 5G WAN via the TRB (backup)
private_if="ix2"                # Private LAN - 192.168.100.0/24
iot_if="ix2.10"                 # IoT VLAN 10 - 192.168.10.0/24
guest_if="ix2.99"               # Guest VLAN 99 - 172.16.99.0/24

server_host="192.168.100.10"
server_ports="{ 32400, 8096, 8123, 1883, 8883 }"
was110_admin="192.168.11.1"
was110_mgmt="192.168.11.2"      # ixl0 alias, owned by rc.conf
tmo_modem="192.168.12.1"        # TRB admin UI
tmo_mgmt="192.168.12.2"         # ix0 alias, owned by rc.conf

# TCP MSS on TMO: the TRB's RA advertises IPv6 MTU 1472, and its 464XLAT
# CLAT turns each IPv4 packet into IPv6 (+20 bytes), so both families get
# 1472 - 60 = 1412. p2_pf.sh measures the IPv4 path and warns if lower.
tmo_mss="1412"

# UniFi controller (real address on private LAN)
unifi_controller="192.168.100.4"
# Ports needed for captive portal operation
unifi_portal_tcp="{ 8843, 8880, 8443, 80, 443 }"

# ICMPv6 types required for IPv6 operation
icmp6_types="{ echoreq, echorep, unreach, toobig, timex, paramprob, \
               neighbrsol, neighbradv, routersol, routeradv }"

# Services allowed INBOUND from the internet
wan_in_tcp="{ ssh, http, https }"

# Services allowed OUTBOUND from all internal networks
outbound_services="{ domain, http, https, ntp, smtp, ssh }"

# ULA prefix block - stable, never changes
ula_all="fd00:1234:5678::/48"
ula_lan="fd00:1234:5678:1::/64"
ula_iot="fd00:1234:5678:10::/64"
ula_guest="fd00:1234:5678:99::/64"

###############################################################################
# TABLES
###############################################################################

table <nat_approved_wide> { 192.168.100.0/24, 192.168.10.0/24, 172.16.99.0/24 }
table <fail2ban> persist
table <self> { self }
table <private_net> { 192.168.100.0/24 }
table <iot_net> { 192.168.10.0/24 }
table <guest_net> { 172.16.99.0/24 }
table <internal_nets> { 192.168.100.0/24, 192.168.10.0/24, 172.16.99.0/24, \
                         192.168.11.0/24, 192.168.12.0/24, 192.0.0.0/24 }

# Each uplink's current DHCP address (the NAT target). Loaded from the files
# the dhclient hooks write, so a reload or boot starts correct; the hooks
# also update the live table on every lease. The files must exist.
table <att_addr> persist file "/var/db/att_ip"
table <tmo_addr> persist file "/var/db/tmo_ip"

# Dynamic IPv6 GUA tables — populated by dhcp6c-script.sh on every
# BOUND/RENEW/REBIND/REQUEST event via: pfctl -t <table> -T replace <prefix>
# These persist across reboots but start empty until dhcp6c binds.
table <ip6_gua_lan>   persist  # e.g. 2001:db8:5130:0::/64
table <ip6_gua_iot>   persist  # e.g. 2001:db8:5130:1::/64
table <ip6_gua_guest> persist  # e.g. 2001:db8:5130:2::/64
table <ip6_gua_all>   persist  # all three combined — for cross-VLAN blocks

###############################################################################
# OPTIONS
###############################################################################

set block-policy return
set loginterface egress
set state-policy floating
set skip on lo0

# TEMPORARY: Disable rule optimization to avoid EN-26:08 deduplication bug
# Remove after 15.1-RELEASE upgrade is confirmed stable (EN-26:08/SA-26:09 fixed there)
set ruleset-optimization none

###############################################################################
# NORMALIZATION
###############################################################################

# Scrub rules are first-match: the TMO clamp must come before the catch-all.
scrub on $tmo_if all max-mss $tmo_mss
scrub in all

###############################################################################
# NAT
###############################################################################

# Management NAT first (nat is first-match): LAN reaches the WAS-110 and the
# TRB from the rc.conf-owned on-link aliases.
nat on $att_if inet from { <nat_approved_wide>, <self> } to $was110_admin -> $was110_mgmt
nat on $tmo_if inet from { <nat_approved_wide>, <self> } to $tmo_modem -> $tmo_mgmt

# Outbound NAT, one static rule per uplink; the FIB 0 route picks which.
nat on $att_if inet from <nat_approved_wide> to any -> <att_addr>
nat on $tmo_if inet from <nat_approved_wide> to any -> <tmo_addr>

# Guest captive portal redirect: guest clients connect to the firewall's
# guest interface (172.16.99.1 / guest.home.example.com) and PF transparently
# forwards portal ports to the real UniFi controller on the private LAN.
# Guests never see 192.168.100.4 or know the private subnet exists.
rdr on $guest_if proto tcp from <guest_net> to ($guest_if) \
    port $unifi_portal_tcp -> $unifi_controller

# miniupnpd anchors - handles dynamic port forwards for Xbox, Switch, etc.
rdr-anchor "miniupnpd"

# Pterodactyl Game Server Management Platform
# Server hosts the Pterodactyl Panel (web UI) and Wings (server daemon)
# Panel web UI is reverse-proxied via Apache at games.example.com -> server:8480
# Game servers run on dynamically allocated ports 25565-25600 (Minecraft default range)
rdr on $att_if proto { tcp, udp } from any to ($att_if) port 25565:25600 -> 192.168.100.10

# GeyserMC Bedrock Edition - UDP ports for Bedrock clients connecting via GeyserMC
# Bedrock servers run on dynamically allocated ports 19132-19142
rdr on $att_if proto udp from any to ($att_if) port 19132:19142 -> 192.168.100.10

# Pterodactyl Wings SFTP server for game file management
# Allows remote file upload/download for game server configurations
# Commented out by default - enable if remote file access needed from WAN
# rdr on $att_if proto tcp from any to ($att_if) port 2022 -> 192.168.100.10 port 2022


###############################################################################
# FILTER ANCHORS
###############################################################################

# miniupnpd dynamic pass rules - evaluated before block rules
anchor "miniupnpd"

# fail2ban dynamic block rules - evaluated on WAN ingress
anchor "f2b/*" in on egress

###############################################################################
# DEFAULT BLOCK
###############################################################################

block in log all
block in quick from <fail2ban>

###############################################################################
# ICMPv6 - CRITICAL FOR IPv6 OPERATION
###############################################################################

# WAN ICMPv6 - required for NDP, PMTUD, DHCPv6-PD signaling
pass in quick on $att_if inet6 proto icmp6 all icmp6-type $icmp6_types keep state
pass out quick on $att_if inet6 proto icmp6 all icmp6-type $icmp6_types keep state

# TMO ICMPv6: the TRB's RAs give router itself a SLAAC address on ix0. ix0 is
# no_radr (rc.conf), so no default router; LAN clients never see TMO's
# prefixes (radvd advertises only ATT PD + ULA; p2_pf.sh checks that).
pass in quick on $tmo_if inet6 proto icmp6 all icmp6-type $icmp6_types keep state
pass out quick on $tmo_if inet6 proto icmp6 all icmp6-type $icmp6_types keep state

# LAN ICMPv6 - required for SLAAC, NDP on all internal interfaces
pass quick on { $private_if $iot_if $guest_if } inet6 proto icmp6 all keep state

###############################################################################
# ICMP IPv4
###############################################################################

pass quick proto icmp all

###############################################################################
# WAN MANAGEMENT (WAS-110 + TRB)
###############################################################################

# Private LAN -> WAS-110 admin interface
pass in quick on $private_if proto { tcp, icmp, udp } from <private_net> to $was110_admin
pass out quick on $att_if proto { tcp, icmp, udp } from { $was110_mgmt, <self> } to $was110_admin

# Private LAN -> TRB admin interface
pass in quick on $private_if proto { tcp, icmp, udp } from <private_net> to $tmo_modem
pass out quick on $tmo_if proto { tcp, icmp, udp } from { $tmo_mgmt, <self> } to $tmo_modem

###############################################################################
# DHCP AND DHCPv6
###############################################################################

# DHCPv4 - all interfaces (needed on WAN for ATT/TMO lease acquisition)
pass in quick proto udp from any to any port { 67, 68 }
pass out quick proto udp from any to any port { 67, 68 }

# DHCPv6 - WAN client: prefix delegation from ATT; TMO allowed for P4 testing
pass in quick on { $att_if $tmo_if } proto udp from any port 547 to any port 546 keep state
pass out quick on { $att_if $tmo_if } proto udp from any port 546 to any port 547 keep state

# DHCPv6 - LAN: serving prefixes to internal clients
pass in quick on { $private_if $iot_if $guest_if } proto udp from any port 546 to any port 547 keep state
pass out quick on { $private_if $iot_if $guest_if } proto udp from any port 547 to any port 546 keep state

###############################################################################
# PRIVATE LAN
###############################################################################

# Full trust - all traffic allowed (stateless for performance)
pass quick on $private_if keep state

###############################################################################
# IOT VLAN
###############################################################################

# Block cross-VLAN IPv6: IoT cannot reach Private or Guest (ULA + GUA)
# ULA rules are hardcoded — GUA rules use dynamic tables populated by dhcp6c-script.sh
block in quick on $iot_if inet6 from $ula_iot to $ula_lan
block in quick on $iot_if inet6 from $ula_iot to $ula_guest
block in quick on $iot_if inet6 from <ip6_gua_iot> to <ip6_gua_lan>
block in quick on $iot_if inet6 from <ip6_gua_iot> to <ip6_gua_guest>

# Block cross-VLAN IPv4: IoT cannot reach Private or Guest
block in quick on $iot_if from <iot_net> to <private_net>
block in quick on $iot_if from <iot_net> to <guest_net>

# IoT intra-VLAN communication (mDNS, device discovery) - IPv4 + IPv6
pass in quick on $iot_if from <iot_net> to <iot_net>
pass in quick on $iot_if inet6 from $ula_iot to $ula_iot
pass in quick on $iot_if inet6 from <ip6_gua_iot> to <ip6_gua_iot>

# IoT -> Server services (Plex, Jellyfin, Home Assistant, MQTT) - IPv4 only
pass in quick on $iot_if proto tcp from <iot_net> to $server_host port $server_ports

# IoT -> Firewall: DNS and NTP only (IPv4 + IPv6)
pass in quick on $iot_if proto { tcp, udp } from <iot_net> to ($iot_if) port { domain, ntp }
pass in quick on $iot_if inet6 proto { tcp, udp } from $ula_iot to ($iot_if) port { domain, ntp }
pass in quick on $iot_if inet6 proto { tcp, udp } from <ip6_gua_iot> to ($iot_if) port { domain, ntp }

# IoT -> Internet: anything not internal (IPv4 + IPv6)
# IPv6: block traffic to other internal GUA/ULA, allow everything else
pass in quick on $iot_if from <iot_net> to ! <internal_nets>
pass in quick on $iot_if inet6 from $ula_iot to ! $ula_all
pass in quick on $iot_if inet6 from <ip6_gua_iot> to ! <ip6_gua_all>

###############################################################################
# GUEST VLAN
###############################################################################

# Guest -> UniFi captive portal via rdr
# Clients connect to 172.16.99.1 (guest.home.example.com), PF rdr rewrites
# destination to 192.168.100.4 BEFORE filter evaluation, so this rule must
# match the post-rdr destination (the real controller address).
pass in quick on $guest_if proto tcp from <guest_net> to $unifi_controller \
    port $unifi_portal_tcp

# Block cross-VLAN IPv6: Guest cannot reach Private or IoT (ULA + GUA)
block in quick on $guest_if inet6 from $ula_guest to $ula_lan
block in quick on $guest_if inet6 from $ula_guest to $ula_iot
block in quick on $guest_if inet6 from <ip6_gua_guest> to <ip6_gua_lan>
block in quick on $guest_if inet6 from <ip6_gua_guest> to <ip6_gua_iot>

# Block cross-VLAN IPv4: Guest cannot reach Private or IoT
block in quick on $guest_if from <guest_net> to <private_net>
block in quick on $guest_if from <guest_net> to <iot_net>

# Guest intra-VLAN communication (IPv4 + IPv6)
pass in quick on $guest_if from <guest_net> to <guest_net>
pass in quick on $guest_if inet6 from $ula_guest to $ula_guest
pass in quick on $guest_if inet6 from <ip6_gua_guest> to <ip6_gua_guest>

# Guest -> Firewall: DNS and NTP only (IPv4 + IPv6)
pass in quick on $guest_if proto { tcp, udp } from <guest_net> to ($guest_if) port { domain, ntp }
pass in quick on $guest_if inet6 proto { tcp, udp } from $ula_guest to ($guest_if) port { domain, ntp }
pass in quick on $guest_if inet6 proto { tcp, udp } from <ip6_gua_guest> to ($guest_if) port { domain, ntp }

# Guest -> Internet: anything not internal (IPv4 + IPv6)
pass in quick on $guest_if from <guest_net> to ! <internal_nets>
pass in quick on $guest_if inet6 from $ula_guest to ! $ula_all
pass in quick on $guest_if inet6 from <ip6_gua_guest> to ! <ip6_gua_all>

###############################################################################
# WAN INBOUND - Services exposed to the internet
###############################################################################

# SSH/HTTP/HTTPS with brute-force protection via PF overload + fail2ban
# (Nothing is passed in on $tmo_if: TMO IPv4 is CGNAT/NAT64, so nothing can
# arrive; out-of-band SSH comes in over the AirVPN tunnel instead, P5.)
pass in quick on $att_if proto tcp from any to ($att_if) port $wan_in_tcp \
    flags S/SA keep state \
    (max-src-conn 50, max-src-conn-rate 15/30, overload <fail2ban> flush global)

# Forward return traffic to delegated LAN prefixes
pass in quick on $att_if inet6 to <ip6_gua_lan> keep state
pass in quick on $att_if inet6 to <ip6_gua_iot> keep state
pass in quick on $att_if inet6 to <ip6_gua_guest> keep state

# Pterodactyl game servers - pass redirected traffic to server
# After rdr rewrites destination, filter sees server IP - must pass explicitly
# Java Edition TCP+UDP (25565-25600) + Bedrock/GeyserMC UDP (19132-19142)
pass in quick on $att_if proto { tcp, udp } from any to $server_host port 25565:25600 keep state
pass in quick on $att_if proto udp from any to $server_host port 19132:19142 keep state

# Block everything else inbound on WAN
block in quick on $att_if all
block in quick on $tmo_if all

# Nothing on the LAN talks to the TRB's own IPv6 ULA space (its UI is on
# 192.168.12.1); keeps guest/IoT off it once P4 NATs IPv6 out ix0.
block out quick on $tmo_if inet6 to fc00::/7

###############################################################################
# OUTBOUND
###############################################################################

# Explicit outbound service ports
pass out quick proto { tcp, udp } from any to any port $outbound_services keep state

# Catch-all outbound - allows all initiated-from-inside traffic
pass out quick inet keep state
pass out quick inet6 keep state
