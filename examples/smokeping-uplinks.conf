# Excerpt of a working smokeping config: per-uplink probes and targets.
# Merge into your own config. FPingDefault replaces plain FPing for your
# existing targets (a probe with instances can't be used directly).
# The Uplinks tree sits under '+ FPings' / '++ Network' in the original.

*** Probes ***

+ FPing

binary = /usr/local/sbin/fping
timeout = 5
mininterval = .001

# Instances. Once a probe has instances its parent can't be used directly,
# so the ordinary probes (FIB 0, whichever uplink is active) are FPingDefault.
++ FPingDefault

# Per-uplink: the binary is a wrapper that runs fping in that uplink's own
# FIB (1 = ATT, 2 = TMO), so both are graphed whichever one is carrying
# traffic. Targets using them must be IP literals.
++ FPingATT
binary = /usr/local/libexec/fping-att

++ FPingTMO
binary = /usr/local/libexec/fping-tmo

+ TraceroutePing

# T-Mobile's routers ignore echo and only answer hop-limit-exceeded. The
# v6 "binary" runs traceroute6 in FIB 2 and reports whatever answers at hop
# N as ::N (hop 2 is two load-balanced gateways); see that script.
binary = /usr/sbin/traceroute
binaryv6 = /usr/local/libexec/traceroute6-tmo
forks = 1
timeout = 60


*** Targets ***

# ... + FPings / ++ Network ...
+++ Uplinks
title = Uplinks - ATT and TMO, each probed through its own FIB
menu = Uplinks

++++ ATT
title = ATT fiber (ixl0, FIB 1)
menu = ATT
probe = FPingATT

+++++ CloudFlare
title = ATT - CloudFlare 1.1.1.1
host = 1.1.1.1

+++++ Google
title = ATT - Google 8.8.8.8
host = 8.8.8.8

+++++ Level3
title = ATT - Level 3 4.2.2.1
host = 4.2.2.1

++++ TMO
title = TMO 5G (ix0, FIB 2)
menu = TMO
probe = FPingTMO

+++++ CloudFlare
title = TMO - CloudFlare 1.1.1.1
host = 1.1.1.1

+++++ Google
title = TMO - Google 8.8.8.8
host = 8.8.8.8

+++++ Level3
title = TMO - Level 3 4.2.2.1
host = 4.2.2.1

+++++ First_Hop
title = TMO - T-Mobile first hop (hop 2, whichever gateway answers)
probe = TraceroutePing
host = ::2
desthost = 2001:4860:4860::8888
minttl = 2
maxttl = 2
wait = 2

++++ Compare
title = ATT vs TMO - CloudFlare 1.1.1.1
menu = ATT vs TMO
host = /FPings/Network/Uplinks/ATT/CloudFlare /FPings/Network/Uplinks/TMO/CloudFlare

