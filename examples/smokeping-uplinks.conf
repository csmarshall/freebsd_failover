# Excerpt of a working smokeping config: per-uplink probes and targets.
# Merge into your own config. FPingDefault replaces plain FPing for your
# existing targets (a probe with instances can't be used directly).
# The Uplinks tree sits under '+ FPings' / '++ Network' in the original.

*** Probes ***

+ FPing

binary = /usr/local/sbin/fping
timeout = 5
mininterval = .001

# Instances. Once a probe has instances its parent can't be used directly,
# so the ordinary probes (FIB 0, whichever uplink is active) are FPingDefault.
++ FPingDefault

# Per-uplink: the binary is a wrapper that runs fping in that uplink's own
# FIB (1 = PRIMARY, 2 = BACKUP), so both are graphed whichever one is carrying
# traffic. Targets using them must be IP literals.
++ FPingPrimary
binary = /usr/local/libexec/fping-pri

++ FPingBackup
binary = /usr/local/libexec/fping-bak

+ TraceroutePing

# the 5G carrier's routers ignore echo and only answer hop-limit-exceeded. The
# v6 "binary" runs traceroute6 in FIB 2 and reports whatever answers at hop
# N as ::N (hop 2 is two load-balanced gateways); see that script.
binary = /usr/sbin/traceroute
binaryv6 = /usr/local/libexec/traceroute6-bak
forks = 1
timeout = 60


*** Targets ***

# ... + FPings / ++ Network ...
+++ Uplinks
title = Uplinks - PRIMARY and BACKUP, each probed through its own FIB
menu = Uplinks

++++ PRIMARY
title = PRIMARY fiber (ixl0, FIB 1)
menu = PRIMARY
probe = FPingPrimary

+++++ CloudFlare
title = PRIMARY - CloudFlare 1.1.1.1
host = 1.1.1.1

+++++ Google
title = PRIMARY - Google 8.8.8.8
host = 8.8.8.8

+++++ Level3
title = PRIMARY - Level 3 4.2.2.1
host = 4.2.2.1

++++ BACKUP
title = BACKUP 5G (ix0, FIB 2)
menu = BACKUP
probe = FPingBackup

+++++ CloudFlare
title = BACKUP - CloudFlare 1.1.1.1
host = 1.1.1.1

+++++ Google
title = BACKUP - Google 8.8.8.8
host = 8.8.8.8

+++++ Level3
title = BACKUP - Level 3 4.2.2.1
host = 4.2.2.1

+++++ First_Hop
title = BACKUP - the 5G carrier first hop (hop 2, whichever gateway answers)
probe = TraceroutePing
host = ::2
desthost = 2001:4860:4860::8888
minttl = 2
maxttl = 2
wait = 2

++++ Compare
title = PRIMARY vs BACKUP - CloudFlare 1.1.1.1
menu = PRIMARY vs BACKUP
host = /FPings/Network/Uplinks/PRIMARY/CloudFlare /FPings/Network/Uplinks/BACKUP/CloudFlare

